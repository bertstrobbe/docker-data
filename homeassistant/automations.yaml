- id: '1777829859455'
  alias: Auto airco Slaapkamer (Zon & Temp)
  description: ''
  triggers:
  - trigger: numeric_state
    entity_id: sensor.slaapkamer_bert_veerle_temperatuur
    above: input_number.drempel_temperatuur_airco
  - trigger: numeric_state
    entity_id: sensor.shelly_zonne_energie_rechts_a_vermogen
    above: input_number.drempel_zonne_energie
    for:
      minutes: 5
  conditions:
  - condition: template
    value_template: '{{ states(''sensor.slaapkamer_bert_veerle_temperatuur'') | float
      > states(''input_number.drempel_temperatuur_airco'') | float }}'
  - condition: template
    value_template: '{{ states(''sensor.shelly_zonne_energie_rechts_a_vermogen'')
      | float(0) > states(''input_number.drempel_zonne_energie'') | float(0) }}'
  - condition: state
    entity_id: climate.master_bedroom_room
    state: 'off'
  actions:
  - action: climate.set_hvac_mode
    metadata: {}
    target:
      entity_id: climate.master_bedroom_room
    data:
      hvac_mode: cool
  - action: notify.mobile_app_pixel_10_pro
    data:
      title: Airco geactiveerd
      message: 'Koeling gestart in master bedroom ({{ states(''sensor.slaapkamer_bert_veerle_temperatuur'')}}
        °C). Opbrengst is {{ states(''sensor.shelly_zonne_energie_rechts_a_vermogen'')
        }}W. '
