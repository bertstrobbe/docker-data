- id: '1777824697734'
  alias: 'Klimaat: Screens Master Bedroom Beheer'
  description: ''
  triggers:
  - entity_id: sensor.shelly_zonne_energie_rechts_a_vermogen
    above: input_number.drempel_zonne_energie
    trigger: numeric_state
    for:
      minutes: 5
  - entity_id:
    - sensor.slaapkamer_bert_veerle_temperatuur
    above: input_number.drempel_temperatuur_airco
    trigger: numeric_state
  conditions:
  - condition: numeric_state
    entity_id: sensor.shelly_zonne_energie_rechts_a_vermogen
    above: input_number.drempel_zonne_energie
  - condition: numeric_state
    entity_id: sensor.slaapkamer_bert_veerle_temperatuur
    above: input_number.drempel_temperatuur_airco
  - condition: numeric_state
    entity_id: cover.screens_slaapkamer
    attribute: current_position
    above: 80
  - condition: numeric_state
    entity_id: sensor.regenmeter_neerslag
    below: 0.1
  actions:
  - action: cover.set_cover_position
    target:
      entity_id:
      - cover.screens_slaapkamer
    data:
      position: '{{ states(''input_number.target_positie_screens_cats'') | int }}'
  - data:
      message: Screens Master Bedroom naar {{ states('input_number.target_positie_screens_cats')
        }}% wegens zon/warmte.
      title: Screens master bedroom omlaag
    action: notify.mobile_app_pixel_10_pro
